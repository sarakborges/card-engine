name: .NET validation

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CardEngine.sln

      - name: Build
        run: dotnet build CardEngine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CardEngine.sln --configuration Release --no-build --verbosity normal
